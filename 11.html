<!DOCTYPE html>
<html lang="es"     

<head>  
    <meta charset="UTF-8">
    <meta name="author" content="Kevinn Cuervo">
    <meta name="Description" content="Registro tienda">
    <title>Número 11</title>
</head>
<body>
    <h1>Registro en nuestra tienda</h1>
    <form>
        <label for="usuario">Nombre de usuario</label><br>
        <input type="text" id="usuario" name="usuario" placeholder="Ej: Luis"><br><br>
        <label for="Email">Email</label><br>
        <input type="email" id="Email" name="Email" placeholder="Ej: luis@gmail.com"><br><br>
        <label for="Edad">Edad</label><br>
        <input type="number" id="Edad" name="Edad" placeholder="Ej: 21"><br><br>
        <label for="Género">Género</label><br>
        <input type="radio" id="Masculino" name="Género" value="Masculino"> Masculino<br>
        <input type="radio" id="Femenino" name="Género" value="Femenino"> Femenino<br><br>
        <label for="Recomendado">Recomendado</label><br>
        <select id="Recomendado" name="Recomendado">
            <option value="Google">Google</option>
            <option value="Facebook">Facebook</option>
            <option value="Publicidad">Publicidad</option>
        </select><br><br>
        <label for="Comentarios">Comentarios</label><br>
        <textarea id="Comentarios" name="Comentarios"></textarea><br><br>
        <label for="Terminos">Acepto términos y condiciones</label><br>
        <input type="radio" id="Terminos" name="Terminos"><br><br>
        <input type="submit" value="Registrar">
    </form>
</body>
</html>
